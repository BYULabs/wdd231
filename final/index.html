<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AniStream - Discover trending anime, search your favorites, and build your personal watchlist">
    <meta name="author" content="Sebastián Iturralde">
    <meta property="og:title" content="AniStream - Anime Discovery Platform">
    <meta property="og:description" content="Search, discover, and track your favorite anime with AniStream">
    <meta property="og:url" content="https://byulabs.github.io/wdd231/final">
    <title>AniStream — Discover Anime</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/main.css">

    <script type="module" src="scripts/main.mjs"></script>
</head>
<body>
    <header>
        <dic class="header-container">
    
            <a href="" class="logo">
                <span class="logo-text">Ani<span class="logo-accent">Stream</span></span>
            </a>

            <nav class="desktop-nav">
                <a href="#" class="nav-link active">Home</a>
                <a href="#" class="nav-link">Browse Season</a>
                <a href="#" class="nav-link">Schedule</a>
            </nav>

            <div class="search-container">
                <button class="search-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-search-icon lucide-search"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>
                    <span>Search Anime</span>
                </button>
            </div>
            <div class="mobile-controls">
                <button class="mobile-search-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-search-icon lucide-search"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>
                </button>
                <button id="menuToggle" class="mobile-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-menu-icon lucide-menu"><path d="M4 5h16"/><path d="M4 12h16"/><path d="M4 19h16"/></svg>
                </button>
            </div>
        </dic>
    </header>

    <!-- Mobile Slide Menu -->
    <div id="mobileOverlay"></div>
    <nav id="mobileMenu" class="mobile-menu">
        <button id="mobileMenuClose" class="mobile-menu-close">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x-icon lucide-x"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
        <a href="#">Home</a>
        <a href="#">Browse Season</a>
        <a href="#">Schedule</a>
    </nav>

    <main>
        <section class="hero-section">
            <div class="hero-image-wrapper">
                <img src="https://cdn.myanimelist.net/images/anime/1133/156346l.jpg" alt="Featured Anime">
            </div>

            <div class="hero-fade-bottom"></div>
            <div class="hero-fade-left"></div>

            <div class="hero-content">
                <div class="hero-text">
                    <div class="season-tag">
                        <span class="glow-dot">●</span>
                        <span class="season-tag-text">Anticipated Upcoming Hype</span>
                    </div>

                    <h1 class="hero-title">
                        Saga of Tanya the Evil II
                    </h1>

                    <p class="hero-description">
                        Second season of Youjo Senki.
                    </p>

                    <button class="cta-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-circle-play-icon lucide-circle-play"><path d="M9 9.003a1 1 0 0 1 1.517-.859l4.997 2.997a1 1 0 0 1 0 1.718l-4.997 2.997A1 1 0 0 1 9 14.996z"/><circle cx="12" cy="12" r="10"/></svg>
                        View Details
                    </button>
                </div>
            </div>
        </section>
        <section class="latest-section">
            <div class="latest-container">
            
            <!-- Section Header -->
            <div class="section-header">
                <div class="section-line"></div>
                <h2 class="section-title">Trending This Season</h2>
            </div>

            </div>
        </section>
    </main>

    <footer>
        <div class="footer-container">
            <a href="#" class="footer-logo">
                Ani<span class="footer-logo-accent">Stream</span>
            </a>
            <p class="footer-text">&copy; 2026 AniStream. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
