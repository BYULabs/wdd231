<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AniStream - Discover trending anime, search your favorites, and build your personal watchlist">
    <meta name="author" content="Sebastián Iturralde">
    <meta property="og:title" content="AniStream - Anime Discovery Platform">
    <meta property="og:description" content="Search, discover, and track your favorite anime with AniStream">
    <meta property="og:url" content="https://byulabs.github.io/wdd231/final">
    <title>AniStream — Discover Anime</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <header>
        <dic class="header-container">
    
            <a href="" class="logo">
                <span class="logo-text">Ani<span class="logo-accent">Stream</span></span>
            </a>

            <nav class="desktop-nav">
                <a href="#" class="nav-link active">Home</a>
                <a href="#" class="nav-link">Browse Season</a>
                <a href="#" class="nav-link">Schedule</a>
            </nav>

            <div class="search-container">
                <button class="search-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-search-icon lucide-search"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>
                    <span>Search Anime</span>
                </button>
            </div>
            <div class="mobile-controls">
                <button class="mobile-search-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-search-icon lucide-search"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>
                </button>
                <button id="menuToggle" class="mobile-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-menu-icon lucide-menu"><path d="M4 5h16"/><path d="M4 12h16"/><path d="M4 19h16"/></svg>
                </button>
            </div>
        </dic>
    </header>

    <main>
    </main>

    <footer>
    </footer>
</body>
</html>
